services:
  # 1. FastAPI Backend — Docker build from repo root
  - type: web
    name: emotionverse-backend
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: "EmotionVerse AI"
      - key: APP_VERSION
        value: "1.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: DATABASE_URL
        value: "sqlite:///./emotionverse.db"
      - key: PORT
        value: "8000"

  # 2. React + Vite Frontend — static site
  - type: web
    name: emotionverse-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: emotionverse-backend
          property: host
          path: /api
